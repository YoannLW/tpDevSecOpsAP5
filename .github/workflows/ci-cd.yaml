name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - feat/**
      - feature/**

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # --- Trufflehog ---
      - name: Trufflehog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --json

      # --- Trivy ---
      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
        continue-on-error: false

      # --- Gosec (analyse Go) ---
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Install dependencies
        run: |
          cd backend
          go mod download
          
      - name: Run Gosec Security Check
        run: |
          cd backend
          # Install gosec binary
          curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.18.2
          # Run gosec
          $(go env GOPATH)/bin/gosec -severity medium ./...

  deploy:
    name: Deploy to Coolify
    needs: security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify Deployment
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK }}"
